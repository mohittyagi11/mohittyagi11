name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/dose-debug.apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dose-debug-apk
          path: out/dose-debug.apk
          if-no-files-found: error

      # Publish a direct-download, installable APK to a rolling prerelease so it
      # can be grabbed straight from a phone browser — no login, no zip.
      - name: Publish APK to "latest debug" release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Dose — latest debug build
          prerelease: true
          body: |
            Auto-built debug APK from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Install on Android: download **dose-debug.apk**, then allow "install
            from unknown sources" when prompted. Debug build — not for production.
          files: out/dose-debug.apk
